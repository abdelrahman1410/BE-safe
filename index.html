<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BE SAFE | Health, Safety & Environment</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .card{
      display:block;
      text-decoration:none;
      color:inherit;
      background:#101a33;
      padding:22px;
      border-radius:16px;
      box-shadow:0 10px 25px rgba(0,0,0,.35);
      border:1px solid transparent;
      transition:.2s;
    }
    .card:hover{transform:translateY(-2px);border-color:#00d1b2}
    .card p{opacity:.8}
  </style>
</head>

<body style="
  margin:0;
  font-family:Arial, sans-serif;
  background:#0b1220;
  color:#ffffff;
">

  <div style="
    max-width:1000px;
    margin:auto;
    padding:40px 20px;
    text-align:center
  ">

    <h1 style="margin-bottom:6px">BE SAFE</h1>
    <p style="opacity:.85;margin-top:0">
      Health, Safety & Environment
    </p>

    <!-- Main Cards -->
    <div style="
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:16px;
      margin-top:40px
    ">

      <!-- Safety Services -->
      <a class="card" href="services/">
        <h3>🛠 Safety Services</h3>
        <p>Audits, Training & Consultancy</p>
      </a>

      <!-- Safety Library -->
      <a class="card" href="library/">
        <h3>📚 Safety Library</h3>
        <p>PTW, JSA & Risk Assessment</p>
      </a>

      <!-- Risk Tools -->
      <a class="card" href="tools/">
        <h3>📊 Risk Tools</h3>
        <p>Matrices & Calculators</p>
      </a>

      <!-- Request Service -->
      <a class="card" href="request/">
        <h3>📞 Request Service</h3>
        <p>Contact & WhatsApp</p>
      </a>

    </div>

    <p style="opacity:.65;font-size:14px;margin-top:40px">
      © BE SAFE – Safety Solutions
    </p>

  </div>

</body>
</html>
